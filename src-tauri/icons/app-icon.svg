<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3466"/>
      <stop offset="45%" stop-color="#0e1a38"/>
      <stop offset="100%" stop-color="#070e20"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0%" stop-color="#5a7fd6" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#5a7fd6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#5a7fd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2c8"/>
      <stop offset="30%" stop-color="#f6cf6a"/>
      <stop offset="75%" stop-color="#e0a43a"/>
      <stop offset="100%" stop-color="#b2760e"/>
    </linearGradient>
    <linearGradient id="barDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b4205"/>
      <stop offset="100%" stop-color="#4a2c03"/>
    </linearGradient>
    <linearGradient id="lineG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f6cf6a"/>
      <stop offset="50%" stop-color="#ffdf8a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <rect x="22" y="22" width="980" height="980" rx="210" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="5"/>
  <rect x="34" y="34" width="956" height="956" rx="200" fill="none" stroke="#5a7fd6" stroke-opacity="0.14" stroke-width="2"/>

  <!-- ground glow -->
  <ellipse cx="512" cy="826" rx="320" ry="46" fill="#e5a83c" opacity="0.15" filter="url(#soft)"/>

  <!-- ===== BAR CHART ===== 4 bars ascending -->
  <g>
    <!-- bars 3D edge (dark bottom) -->
    <g fill="url(#barDark)">
      <rect x="316" y="632" width="92" height="140" rx="20"/>
      <rect x="416" y="562" width="92" height="210" rx="20"/>
      <rect x="516" y="472" width="92" height="300" rx="20"/>
      <rect x="616" y="372" width="92" height="400" rx="20"/>
    </g>

    <!-- bars main gold -->
    <g fill="url(#barGold)">
      <rect x="316" y="610" width="92" height="150" rx="20"/>
      <rect x="416" y="540" width="92" height="220" rx="20"/>
      <rect x="516" y="450" width="92" height="310" rx="20"/>
      <rect x="616" y="350" width="92" height="410" rx="20"/>
    </g>

    <!-- bar top highlights -->
    <g fill="#ffffff" opacity="0.5">
      <rect x="316" y="610" width="92" height="9" rx="5"/>
      <rect x="416" y="540" width="92" height="9" rx="5"/>
      <rect x="516" y="450" width="92" height="9" rx="5"/>
      <rect x="616" y="350" width="92" height="9" rx="5"/>
    </g>

    <!-- left edge shade for 3D -->
    <g fill="#000000" opacity="0.14">
      <rect x="316" y="610" width="16" height="150" rx="8"/>
      <rect x="416" y="540" width="16" height="220" rx="8"/>
      <rect x="516" y="450" width="16" height="310" rx="8"/>
      <rect x="616" y="350" width="16" height="410" rx="8"/>
    </g>

    <!-- base line -->
    <rect x="312" y="762" width="400" height="14" rx="7" fill="url(#barDark)"/>
    <rect x="312" y="760" width="400" height="9" rx="5" fill="#f6cf6a" opacity="0.7"/>

    <!-- rising trend line over the bars -->
    <path d="M362 604 L462 534 L562 444 L662 344" fill="none" stroke="url(#lineG)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M362 604 L462 534 L562 444 L662 344" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- endpoint dot -->
    <circle cx="662" cy="344" r="16" fill="#ffffff"/>
    <circle cx="662" cy="344" r="8" fill="#f6cf6a"/>
  </g>

  <!-- sparkle top-left -->
  <g fill="#fff2c8">
    <path d="M300 330 L308 348 L326 356 L308 364 L300 382 L292 364 L274 356 L292 348 Z" opacity="0.9"/>
    <path d="M760 220 L765 232 L777 237 L765 242 L760 254 L755 242 L743 237 L755 232 Z" opacity="0.6"/>
  </g>
</svg>
